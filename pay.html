      </div>

        <label>Description</label>
        <textarea id="descInput" placeholder="What is this payment for? (optional)"></textarea>
      </div>

    </div>

    </div>

<script>
var BACKEND_URL = 'https://aliiiiii-payments-backend.onrender.com';
</script>
<script>
(function(){
  var btn = document.getElementById('payBtn');
  var form = document.getElementById('payForm');
  var status = document.getElementById('payStatus');
  var statusMsg = document.getElementById('statusMsg');
  var amountInput = document.getElementById('amountInput');
  var descInput = document.getElementById('descInput');

  function showForm() {
    form.style.display = 'block';
    status.classList.remove('show');
    btn.disabled = false;
    btn.textContent = 'Proceed to Pay';
  }

  function showStatus(icon, heading, msg, isError) {
    form.style.display = 'none';
    status.classList.add('show');
    document.querySelector('.status-icon').innerHTML = icon;
    document.querySelector('.pay-status h2').textContent = heading;
    statusMsg.innerHTML = msg;
    document.querySelector('.status-icon').style.color = isError ? 'var(--violet)' : '#2ecc71';
  }

  btn.addEventListener('click', function() {
    var amt = parseFloat(amountInput.value);
    if (!amt || amt < 1) {
      amountInput.style.borderColor = 'var(--violet)';
      amountInput.focus();
      return;
    }
    amountInput.style.borderColor = '';
    var desc = descInput.value.trim() || 'Payment';

    btn.textContent = 'Creating order...';
    btn.disabled = true;

    fetch(BACKEND_URL + '/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: amt, description: desc })
    })
    .then(function(r) { return r.json(); })
    .then(function(order) {
      if (order.error) throw new Error(order.error);
      var options = {
        key: 'rzp_live_SyKlszkGegHNIx',
        amount: order.amount,
        currency: 'INR',
        name: 'Ali',
        description: desc,
        order_id: order.id,
        image: 'https://aliiiiii.vercel.app/me.jpg',
        prefill: { contact: '', email: '' },
        theme: { color: '#e74c3c' },
        handler: function(response) {
          fetch(BACKEND_URL + '/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            })
          })
          .then(function(r) { return r.json(); })
          .then(function(v) {
            if (v.status === 'ok') {
              showStatus(
                '&#10003;',
                'Payment Successful',
                'Transaction ID: <strong>' + v.payment_id + '</strong><br>A receipt will be sent to your email.',
                false
              );
            } else {
              showStatus('&#10007;', 'Verification Failed', 'Please contact support with your payment ID.', true);
            }
          })
          .catch(function() {
            showStatus('&#10003;', 'Payment Received', 'Your payment was completed. Please contact me for confirmation.', false);
          });
        },
        modal: {
          ondismiss: function() {
            showStatus('&#10007;', 'Payment Cancelled', 'You closed the payment window. Try again when ready.', true);
            setTimeout(showForm, 3000);
          }
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    })
    .catch(function(err) {
      showStatus('&#10007;', 'Something went wrong', 'Could not create payment. Please try again or contact me directly.', true);
      btn.disabled = false;
      btn.textContent = 'Try Again';
    });
  });
})();
</script>

leftOuter.position.set(-0.7, 0.6, 1.95);
eyeGroup.add(leftOuter);
var rightOuterMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0, side: THREE.BackSide });
var rightOuter = new THREE.Mesh(outerGeo, rightOuterMat);
rightOuter.position.set(0.7, 0.6, 1.95);
eyeGroup.add(rightOuter);

/* Fireflies */
var fireflyGroup = new THREE.Group();
scene.add(fireflyGroup);
var fireflies = [];
var isMobileF = window.innerWidth < 768 || 'ontouchstart' in window;
for (var i = 0; i < (isMobileF ? 8 : 12); i++) {
  var ffGeo = new THREE.SphereGeometry(0.02, 2, 2);
  var ffMat = new THREE.MeshBasicMaterial({ color: 0xffff44, transparent: true, opacity: 0.9 });
  var ff = new THREE.Mesh(ffGeo, ffMat);
  ff.position.set((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20);
  var glowGeo = new THREE.SphereGeometry(0.08, isMobileF ? 4 : 6, isMobileF ? 4 : 6);
  var glowMat = new THREE.MeshBasicMaterial({ color: 0xffff88, transparent: true, opacity: 0.15, side: THREE.BackSide });
  var glow = new THREE.Mesh(glowGeo, glowMat);
  ff.add(glow);
  var ffLight = new THREE.PointLight(0xffff44, 0.3, 3, 2);
  ff.add(ffLight);
  ff.userData = {
    velocity: new THREE.Vector3((Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.04),
    phase: Math.random() * Math.PI * 2,
    pulseSpeed: 2 + Math.random() * 3,
    glowMat: glowMat,
    ffMat: ffMat,
    light: ffLight
  };
  fireflyGroup.add(ff);
  fireflies.push(ff);
}

/* Particles */
var isMobile = window.innerWidth < 768 || 'ontouchstart' in window;
var particles = [];
var particleGroup = new THREE.Group();
scene.add(particleGroup);
var particlePool = [];
var pGeos = [new THREE.SphereGeometry(0.05, isMobile ? 4 : 6, isMobile ? 4 : 6), new THREE.TetrahedronGeometry(0.04, 0), new THREE.OctahedronGeometry(0.045, 0)];
var basePMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c, transparent: true, opacity: 0 });

var poolSize = isMobile ? 6 : 10;
for (var i = 0; i < poolSize; i++) {
  var pg = pGeos[Math.floor(Math.random() * pGeos.length)];
  var pm = basePMat.clone();
  var p = new THREE.Mesh(pg, pm);
  p.visible = false;
  particleGroup.add(p);
  particlePool.push(p);
}

function createParticle() {
  var p;
  if (particlePool.length > 0) { p = particlePool.pop(); p.visible = true; }
  else if (particles.length < (isMobile ? 12 : 15)) {
    p = new THREE.Mesh(pGeos[Math.floor(Math.random() * pGeos.length)], basePMat.clone());
    particleGroup.add(p);
  } else return null;
  var c = new THREE.Color(0xe74c3c);
  c.offsetHSL(Math.random() * 0.1 - 0.05, 0, 0);
  p.material.color.copy(c);
  p.position.copy(ghostGroup.position);
  p.position.z -= 0.8 + Math.random() * 0.6;
  p.position.x += (Math.random() - 0.5) * 3.5;
  p.position.y += (Math.random() - 0.5) * 3.5 - 0.8;
  var s = 0.6 + Math.random() * 0.7;
  p.scale.set(s, s, s);
  p.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
  p.userData = {
    life: 1.0,
    decay: Math.random() * 0.003 + 0.005,
    rotSpeed: { x: (Math.random() - 0.5) * 0.015, y: (Math.random() - 0.5) * 0.015, z: (Math.random() - 0.5) * 0.015 },
    vel: { x: (Math.random() - 0.5) * 0.012, y: (Math.random() - 0.5) * 0.012 - 0.002, z: (Math.random() - 0.5) * 0.012 - 0.006 }
  };
  p.material.opacity = Math.random() * 0.35;
  particles.push(p);
}

/* Mouse */
var vFov = camera.fov * Math.PI / 180;
var visibleH = 2 * Math.tan(vFov / 2) * Math.abs(camera.position.z);
var visibleW = visibleH * camera.aspect;
var halfW = visibleW / 2, halfH = visibleH / 2;

var mouse = new THREE.Vector2();
var prevMouse = new THREE.Vector2();
var mouseSpeed = new THREE.Vector2();
var lastMouseUpdate = 0;
var isMouseMoving = false;
var mouseTimer = null;

document.addEventListener("mousemove", function(e) {
  var now = performance.now();
  if (now - lastMouseUpdate > 16) {
    prevMouse.copy(mouse);
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    mouseSpeed.subVectors(mouse, prevMouse);
    isMouseMoving = true;
    if (mouseTimer) clearTimeout(mouseTimer);
    mouseTimer = setTimeout(function() { isMouseMoving = false; }, 80);
    lastMouseUpdate = now;
  }
});

/* Resize */
var resizeTimer;
window.addEventListener("resize", function() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    var wasMobile = isMobile;
    isMobile = window.innerWidth < 768 || 'ontouchstart' in window;
    if (isMobile !== wasMobile) {
      var s = isMobile ? 0.3 : 1;
      ghostBody.scale.set(s, s, s);
    }
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    if (bloomPass) bloomPass.setSize(Math.floor(window.innerWidth / 2), Math.floor(window.innerHeight / 2));
    if (analogPass) analogPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    var vf = camera.fov * Math.PI / 180;
    var vh = 2 * Math.tan(vf / 2) * Math.abs(camera.position.z);
    halfW = (vh * camera.aspect) / 2;
    halfH = vh / 2;
  }, 250);
});

/* Animate */
var time = 0;
var currentMovement = 0;
var lastFrameTime = 0;
var frameCount = 0;

function animate(timestamp) {
  requestAnimationFrame(animate);
  var dt = timestamp - lastFrameTime;
  lastFrameTime = timestamp;
  if (dt > 100) return;
  var ti = (dt / 16.67) * 0.01;
  time += ti;
  frameCount++;

  atmosMat.uniforms.time.value = time;
  if (analogPass) analogPass.uniforms.uTime.value = time;

  var targetX, targetY;
  if (isMobile) {
    var scrollY = window.scrollY || window.pageYOffset;
    targetX = Math.sin(time * 0.8 + scrollY * 0.002) * halfW * 0.6;
    targetY = Math.sin(time * 0.5 + scrollY * 0.0015) * halfH * 0.15;
  } else {
    targetX = mouse.x * halfW;
    targetY = mouse.y * halfH;
  }
  var prevGP = ghostGroup.position.clone();
  var followSpeed = 0.4;
  ghostGroup.position.x += (targetX - ghostGroup.position.x) * followSpeed;
  ghostGroup.position.y += (targetY - ghostGroup.position.y) * followSpeed;
  atmosMat.uniforms.ghostPosition.value.copy(ghostGroup.position);

  var movement = prevGP.distanceTo(ghostGroup.position);
  currentMovement = currentMovement * 0.95 + movement * 0.05;

  var f1 = Math.sin(time * 1.6 * 1.5) * 0.03;
  var f2 = Math.cos(time * 1.6 * 0.7) * 0.018;
  var f3 = Math.sin(time * 1.6 * 2.3) * 0.008;
  ghostGroup.position.y += f1 + f2 + f3;

  var pulse = Math.sin(time * 1.6) * 0.6;
  var breathe = Math.sin(time * 0.6) * 0.12;
  ghostMat.emissiveIntensity = 5.8 + pulse + breathe;

  var scaleV = 1 + Math.sin(time * 2.1) * 0.025 * 0.35 + pulse * 0.015;
  var scaleB = 1 + Math.sin(time * 0.8) * 0.012;
  var fs = scaleV * scaleB * (isMobile ? 0.78 : 1);
  ghostBody.scale.set(fs, fs, fs);
  if (isMobile) eyeGroup.scale.set(0.78, 0.78, 0.78); else eyeGroup.scale.set(1, 1, 1);

  var md = new THREE.Vector2(targetX - ghostGroup.position.x, targetY - ghostGroup.position.y).normalize();
  ghostBody.rotation.z = ghostBody.rotation.z * 0.95 + (-md.x) * 0.1 * 0.35 * 0.05;
  ghostBody.rotation.x = ghostBody.rotation.x * 0.95 + md.y * 0.1 * 0.35 * 0.05;
  ghostBody.rotation.y = Math.sin(time * 1.4) * 0.05 * 0.35;

  var isMoving = currentMovement > 0.07;
  var targetGlow = isMoving ? 1.0 : 0.0;
  var gs = isMoving ? 0.31 * 2 : 0.31;
  var no = leftEyeMat.opacity + (targetGlow - leftEyeMat.opacity) * gs;
  leftEyeMat.opacity = no;
  rightEyeMat.opacity = no;
  leftOuterMat.opacity = no * 0.3;
  rightOuterMat.opacity = no * 0.3;

  if (isMoving && (isMouseMoving || isMobile) && frameCount % (isMobile ? 60 : 3) === 0) {
    for (var i = 0; i < 2; i++) createParticle();
  }

  for (var i = 0; i < fireflies.length; i++) {
    var ff = fireflies[i];
    var ud = ff.userData;
    var pp = Math.sin(time + ud.phase) * 0.3 + 0.5;
    ud.glowMat.opacity = 1.2 * 0.15 * pp;
    ud.ffMat.opacity = 1.2 * 0.9 * pp;
    ud.light.intensity = 1.2 * 0.3 * pp;
    ud.velocity.x += (Math.random() - 0.5) * 0.001;
    ud.velocity.y += (Math.random() - 0.5) * 0.001;
    ud.velocity.z += (Math.random() - 0.5) * 0.001;
    ud.velocity.clampLength(0, 0.04);
    ff.position.add(ud.velocity);
    if (Math.abs(ff.position.x) > 30) ud.velocity.x *= -0.5;
    if (Math.abs(ff.position.y) > 20) ud.velocity.y *= -0.5;
    if (Math.abs(ff.position.z) > 15) ud.velocity.z *= -0.5;
  }

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.userData.life -= p.userData.decay;
    p.material.opacity = p.userData.life * 0.85;
    if (p.userData.vel) {
      p.position.x += p.userData.vel.x;
      p.position.y += p.userData.vel.y;
      p.position.z += p.userData.vel.z;
      p.position.x += Math.cos(time * 1.8 + p.position.y) * 0.0008;
    }
    if (p.userData.rotSpeed) {
      p.rotation.x += p.userData.rotSpeed.x;
      p.rotation.y += p.userData.rotSpeed.y;
      p.rotation.z += p.userData.rotSpeed.z;
    }
    if (p.userData.life <= 0) {
      p.visible = false;
      p.material.opacity = 0;
      particlePool.push(p);
      particles.splice(i, 1);
      i--;
    }
  }

  if (composer) composer.render(); else renderer.render(scene, camera);
}

document.dispatchEvent(new MouseEvent("mousemove", { clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 }));
animate(0);
</script>
</body>
</html>
