  <style>
    /* ════════════════════════════════════════════
       ALI OS — PIXEL-ART OPERATING SYSTEM PORTFOLIO
       ════════════════════════════════════════════ */

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --font-pixel:'Pixelify Sans',monospace;
      --font-ui:'Cascadia Mono','Consolas','JetBrains Mono','Fira Mono',monospace;
      --font-term:'VT323','Courier New',monospace;
      --font-elegant:'Playfair Display',Georgia,'Times New Roman',serif;
      --font-body:'Inter','Segoe UI',sans-serif;
      --bg:#0d0e12;
      --win-bg:#3a1515;
      --win-bg2:#4a1e1e;
      --taskbar:#0f1117;
      --border:rgba(245,230,211,.08);
      --text:#f5e6d3;
      --dim:rgba(245,230,211,.45);
      --dim2:rgba(245,230,211,.3);
      --ac:#4f8cff;
      --cream:#f5e6d3;
      --line:rgba(245,230,211,.08);
    }

    html,body{height:100%}
    body{
      font-family:var(--font-term);
      font-size:24px;
      line-height:1.5;
      color:var(--text);
      background:#0d0e12;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow:hidden;
      -webkit-font-smoothing:none;
    }
    button{cursor:inherit;font-family:inherit}
    a{cursor:inherit}
    ::selection{background:var(--ac);color:#fff}
    body.dragging{user-select:none}

    /* ── Boot loading screen ── */
    #bootScreen{
      position:fixed;top:0;left:0;width:100%;height:100%;
      z-index:9999;
      background:#0d0e12;
      transition:opacity .45s ease;
    }
    @supports (height:100dvh){
      #bootScreen{height:100dvh}
    }
    #bootScreen.done{opacity:0;pointer-events:none}
    #bootScreen svg{
      position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;
      width:130px;height:130px;
      shape-rendering:crispEdges;image-rendering:pixelated;
    }
    #bootScreen rect{opacity:0;animation:bld .22s steps(1) forwards}
    @keyframes bld{to{opacity:1}}

    /* ── CRT overlay ── */
    #crt{
      position:fixed;inset:0;pointer-events:none;z-index:9800;
      background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.4));
    }
    #crt::after{
      content:'';position:absolute;inset:0;
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar{width:14px;height:14px}
    ::-webkit-scrollbar-track{background:#0a0b0f}
    ::-webkit-scrollbar-thumb{background:#2a2f3d;border:3px solid #0a0b0f}
    ::-webkit-scrollbar-thumb:hover{background:var(--ac)}
    ::-webkit-scrollbar-corner{background:#0a0b0f}

    /* ── DESKTOP ── */
    #desktop{
      position:fixed;inset:0;
      overflow:hidden;
      background:transparent;
    }
    /* live wallpaper video */
    #wallpaper{
      position:fixed;inset:0;
      width:100%;height:100%;
      object-fit:cover;
      z-index:0;
      pointer-events:none;
      display:block;
      background:#0d0e12;
      filter:brightness(.88) saturate(1.05);
    }

    /* ── Desktop icons ── */
    #icons{
      position:absolute;top:0;left:0;
      z-index:1;
      display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;
      gap:20px 4px;
      padding:14px 6px;
      height:100%;
    }
    .desk-icon{
      width:112px;height:136px;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;
      padding:6px 2px;
      user-select:none;
      -webkit-user-select:none;
    }
    .desk-icon .ico{
      width:64px;height:64px;
      filter:drop-shadow(3px 3px 0 rgba(0,0,0,.55));
      transition:filter .2s ease;
    }
    .desk-icon:hover .ico{filter:drop-shadow(3px 3px 0 rgba(0,0,0,.55))}
    svg.pxico .ol rect{fill:#000}
    .pxico .iglow rect{fill:var(--ac,#4f8cff)}
    .pxico .iglow{opacity:0;filter:blur(2px);transition:opacity .2s ease}
    .desk-icon .ico .iglow{opacity:.55}
    .desk-icon:hover .ico .iglow{opacity:.8}
    .task-app .tb-ico .iglow{opacity:.5}
    .task-app:hover .tb-ico .iglow{opacity:.75}
    .m-ico .iglow{opacity:.5}
    .desk-icon .lbl{
      font-family:var(--font-pixel);font-size:14px;line-height:1.7;text-align:center;
      color:#fff;
      font-weight:700;
      padding:3px 4px;
      text-shadow:none;
      word-break:break-word;
    }
    .desk-icon:hover .lbl{background:rgba(255,255,255,.08)}
    .desk-icon.selected .lbl{
      background:rgba(79,140,255,.55);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
    }

    /* ── TOAST ── */
    #toast{
      position:fixed;left:50%;bottom:58px;transform:translateX(-50%);
      background:#0f1117;color:#fff;
      font-family:var(--font-pixel);font-size:13px;line-height:1.6;
      padding:11px 16px;text-align:center;
      box-shadow:inset 2px 2px 0 rgba(255,255,255,.1),inset -2px -2px 0 rgba(0,0,0,.6),0 0 0 2px #232733;
      z-index:9700;
      display:none;
      max-width:86vw;
    }
    #toast.show{display:block;animation:pop .16s steps(2)}
    @keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

    /* ── WINDOWS ── */
    .window{
      --font-pixel:var(--font-ui);
      position:absolute;
      display:flex;flex-direction:column;
      min-width:280px;
      background:var(--win-bg);
      box-shadow:
        inset 3px 3px 0 rgba(255,255,255,.08),
        inset -3px -3px 0 rgba(0,0,0,.55),
        0 0 0 3px #08090c,
        0 16px 36px rgba(0,0,0,.6);
      animation:winIn .14s steps(3);
    }
    @keyframes winIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
    .window.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
    .window.min{display:none}
    .window.blur{opacity:.92}
    .window.blur .win-titlebar{background:linear-gradient(180deg,color-mix(in srgb,var(--wbg,var(--win-bg)) 55%,#0d0d0d),color-mix(in srgb,var(--wbg,var(--win-bg)) 38%,#0d0d0d))}

    /* ── RESIZE HANDLES ── */
    .win-resize{position:absolute;inset:0;pointer-events:none}
    .win-resize .rz{position:absolute;pointer-events:auto;touch-action:none}
    .win-resize .rz.nw{left:-3px;top:-3px;width:14px;height:14px}
    .win-resize .rz.ne{right:-3px;top:-3px;width:14px;height:14px}
    .win-resize .rz.sw{left:-3px;bottom:-3px;width:14px;height:14px}
    .win-resize .rz.se{right:-3px;bottom:-3px;width:14px;height:14px}
    .win-resize .rz.n{left:10px;right:10px;top:-3px;height:8px}
    .win-resize .rz.s{left:10px;right:10px;bottom:-3px;height:8px}
    .win-resize .rz.e{top:10px;bottom:10px;right:-3px;width:8px}
    .win-resize .rz.w{top:10px;bottom:10px;left:-3px;width:8px}
    .win-resize .rz.nw,.win-resize .rz.se{cursor:nwse-resize!important}
    .win-resize .rz.ne,.win-resize .rz.sw{cursor:nesw-resize!important}
    .win-resize .rz.n,.win-resize .rz.s{cursor:ns-resize!important}
    .win-resize .rz.e,.win-resize .rz.w{cursor:ew-resize!important}

    .win-titlebar{
      flex:0 0 34px;
      display:flex;align-items:center;gap:9px;
      padding:0 6px 0 10px;
      user-select:none;-webkit-user-select:none;
      touch-action:none;
      background:linear-gradient(180deg,color-mix(in srgb,var(--wbg,var(--win-bg)) 55%,#0d0d0d),color-mix(in srgb,var(--wbg,var(--win-bg)) 38%,#0d0d0d));
      box-shadow:inset 0 -2px 0 #0a0b0f;
    }
    .window:not(.blur) .win-titlebar{
      background:linear-gradient(
        180deg,
        color-mix(in srgb,var(--ac) 38%,var(--wbg,var(--win-bg))),
        color-mix(in srgb,var(--ac) 16%,#0d0d0d)
      );
    }
    .win-ico{width:20px;height:20px;flex:0 0 auto;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6))}
    .win-title{
      font-family:var(--font-pixel);font-size:14px;color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;
    }
    .win-btns{display:flex;gap:0;margin-left:auto;margin-right:-6px;flex:0 0 auto;position:relative;z-index:2}
    .win-btn{
      width:44px;height:34px;
      display:flex;align-items:center;justify-content:center;
      background:transparent;border:0;border-radius:0;outline:none;
      color:rgba(255,255,255,.92);
      transition:background .12s ease;
    }
    .win-btn svg{width:12px;height:12px;display:block}
    .win-btn:hover{background:rgba(255,255,255,.14)}
    .win-btn:active{background:rgba(255,255,255,.07)}
    .win-btn.close:hover{background:#e81123;color:#fff}
    .win-btn.close:active{background:#b10e1e}

    .win-body{
      flex:1;
      overflow:auto;
      padding:24px 26px;
      font-family:var(--font-body);
      font-size:13.5px;
      line-height:1.75;
      color:rgba(245,230,211,.55);
      background-color:var(--wbg,var(--win-bg));
      background-image:
        linear-gradient(rgba(245,230,211,.02) 1px,transparent 1px),
        linear-gradient(90deg,rgba(245,230,211,.02) 1px,transparent 1px),
        radial-gradient(ellipse at 18% -10%,var(--wg1,rgba(74,30,30,.55)) 0%,transparent 55%),
        radial-gradient(ellipse at 92% 112%,var(--wg2,rgba(58,21,21,.5)) 0%,transparent 55%);
      background-size:48px 48px,48px 48px,auto,auto;
      background-repeat:repeat,repeat,no-repeat,no-repeat;
    }

    /* ── Generic pixel bits ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      font-family:var(--font-body);font-size:11.5px;font-weight:500;letter-spacing:3px;
      text-transform:uppercase;
      padding:12px 22px;color:#f5e6d3;
      background:rgba(245,230,211,.05);
      border:1px solid rgba(245,230,211,.25);
      text-decoration:none;
      transition:background .35s ease,border-color .35s ease;
      user-select:none;
    }
    .btn:hover{background:rgba(245,230,211,.12);border-color:rgba(245,230,211,.42)}
    .btn:active{transform:translateY(1px)}
    .accent{color:var(--cream)}

    /* ── ABOUT ── */
    .name em,.proj-name em,.exp h3 em,.svc h3 em,.bin-head em{font-style:italic;font-weight:400;letter-spacing:-.5px}
    .win-h{font-family:var(--font-elegant);font-size:44px;font-weight:400;line-height:1.15;color:#f5e6d3;margin-bottom:18px;max-width:540px}
    .win-body em{font-style:italic;font-weight:400}
    .win-h em{color:#f5e6d3;letter-spacing:-.5px}
    .para em{color:#f5e6d3}
    .para{color:rgba(245,230,211,.85);margin-bottom:12px;font-weight:300}
    .about-wrap{max-width:580px;margin:0}
    .about-wrap .para{font-weight:500}
    .about-wrap .win-h{font-size:44px;line-height:1.15}
    .about-wrap .para:first-of-type{margin-top:18px}
    .window.max .about-wrap{max-width:none}
    .ac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:24px;align-items:start}
    .ac-card{
      position:relative;
      padding:14px 16px 14px;
      background:#8d4a4a;
      border:3px solid #000;
      border-radius:0;
      box-shadow:
        inset 3px 3px 0 #b07070,
        inset -3px -3px 0 #4a2020,
        0 6px 0 rgba(0,0,0,.15);
    }
    .ac-t{
      font-family:var(--font-pixel);
      font-size:14px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      color:#ffd97e;
      text-shadow:2px 2px 0 rgba(0,0,0,.7);
      background:#6b3030;
      margin:-14px -16px 12px;
      padding:9px 16px;
      border-bottom:3px solid #000;
      box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),inset -3px -3px 0 rgba(0,0,0,.3);
    }
    .ac-c{font-family:var(--font-body);font-size:12.5px;line-height:1.75;color:#f5e6d3;text-shadow:1px 1px 0 rgba(0,0,0,.5);font-weight:500}
    .ac-chip{
      display:inline-block;
      margin:0 6px 6px 0;
      padding:3px 10px;
      font-family:var(--font-pixel);
      font-size:11.5px;
      font-weight:400;
      letter-spacing:.5px;
      border:2px solid #000;
      border-radius:0;
      color:#f5e6d3;
      text-shadow:1px 1px 0 rgba(0,0,0,.6);
      background:#a05b5b;
      box-shadow:inset 2px 2px 0 rgba(255,255,255,.2),inset -2px -2px 0 rgba(0,0,0,.35);
      transition:background .15s ease;
    }
    .ac-chip:hover{border-color:#000;background:#b06a6a}
    .ac-li{margin-bottom:6px;color:#f5e6d3;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
    .ac-li:last-child{margin-bottom:0}
    .para b{color:#f5e6d3;font-weight:500}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
    .stat{
      background:rgba(0,0,0,.25);padding:18px 10px;text-align:center;
      border:1px solid rgba(245,230,211,.06);border-radius:8px;
    }
    .s-num{font-family:var(--font-elegant);font-size:22px;font-weight:400;color:#f5e6d3;margin-bottom:6px;letter-spacing:1px}
    .s-lab{font-family:var(--font-body);font-size:10.5px;letter-spacing:2px;color:rgba(245,230,211,.35);line-height:1.7}

    /* ── PROJECTS ── */
    .proj{
      background:rgba(0,0,0,.25);padding:18px 20px;margin-bottom:14px;
      border:1px solid rgba(245,230,211,.06);border-radius:8px;
      transition:border-color .3s ease;
    }
    .proj:hover{border-color:rgba(245,230,211,.15)}
    .proj-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
    .proj-name{font-family:var(--font-elegant);font-size:17px;font-weight:400;letter-spacing:.5px;color:#f5e6d3}
    .proj-year{font-family:var(--font-elegant);font-size:12.5px;font-style:italic;color:rgba(245,230,211,.35)}
    .proj-desc{color:rgba(245,230,211,.5);font-size:13.5px;line-height:1.7;margin-bottom:14px;font-weight:300}
    .proj-actions{display:flex;gap:8px}

    /* ── PROJECTS — FILE MANAGER ── */
    .fm-bar{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px;font-family:var(--font-body);font-size:10.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(245,230,211,.5);border-bottom:1px solid rgba(245,230,211,.08);padding-bottom:12px}
    .fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .fm-folder{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border:1px solid transparent;border-radius:8px;text-decoration:none;text-align:center;transition:border-color .25s ease,background .25s ease}
    .fm-folder:hover{border-color:rgba(245,230,211,.14);background:rgba(245,230,211,.04)}
    .fm-ico{width:56px;height:56px;transition:transform .2s ease}
    .fm-folder:hover .fm-ico{transform:translateY(-2px)}
    .fm-name{font-family:var(--font-pixel);font-size:13px;color:#f5e6d3;word-break:break-word;line-height:1.5;letter-spacing:.5px}
    .fm-meta{font-family:var(--font-body);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(245,230,211,.35)}
    .fm-readme{
      margin-top:16px;
      background:#2e4f3c;
      border:3px solid #000;border-radius:0;
      box-shadow:
        inset 3px 3px 0 #4e8a66,
        inset -3px -3px 0 #1c3326,
        0 6px 0 rgba(0,0,0,.15);
    }
    .fm-readme .r-title{
      display:block;
      font-family:var(--font-pixel);font-size:13px;font-weight:700;letter-spacing:1px;
      text-transform:uppercase;color:#ffd97e;
      text-shadow:2px 2px 0 rgba(0,0,0,.7);
      background:#23402e;
      padding:8px 14px;margin:0 0 14px;
      border-bottom:3px solid #000;
      box-shadow:inset 3px 3px 0 rgba(255,255,255,.15),inset -3px -3px 0 rgba(0,0,0,.3);
    }
    .fm-readme .r-shot{
      display:block;width:calc(100% - 28px);margin:0 auto 14px;
      border:3px solid #000;
      box-shadow:inset 3px 3px 0 rgba(255,255,255,.25),inset -3px -3px 0 rgba(0,0,0,.4);
    }
    .fm-readme .r-proj{padding:0 14px;margin:0}
    .fm-readme .r-name{
      font-family:var(--font-pixel);font-size:15px;font-weight:700;letter-spacing:.5px;
      color:#f5e6d3;text-shadow:2px 2px 0 rgba(0,0,0,.7);
    }
    .fm-readme .r-meta{color:rgba(245,230,211,.45);font-size:10.5px;font-family:var(--font-body)}
    .fm-readme .r-desc{
      color:rgba(245,230,211,.75);font-size:12.5px;line-height:1.7;font-weight:500;
      text-shadow:1px 1px 0 rgba(0,0,0,.5);
      font-family:var(--font-body);
      margin:6px 14px 0;
    }
    .fm-readme .r-link{margin:10px 14px 0;padding-bottom:14px}
    .fm-readme .r-link a{color:#8ab4f8;text-decoration:none;transition:color .15s ease}
    .fm-readme .r-link a:hover{color:#fff}

    /* ── SKILLS (minecraft potions) ── */
    .s-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;margin-top:56px}
    .sk-row{display:flex;align-items:center;gap:14px;min-width:0}
    .sk-ico{width:40px;height:40px;flex:none;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
    .sk-ico svg{width:100%;height:100%}
    .sk-ico svg path{fill:var(--skc)}
    .sk-name{flex:1;min-width:0;font-family:var(--font-pixel);font-size:14px;font-weight:700;letter-spacing:1px;color:#3a1515;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sk-row:hover .sk-name{color:#000}
    .sk-lvl{flex:none;font-family:var(--font-pixel);font-size:11px;font-weight:600;line-height:1;color:rgba(58,21,21,.85);letter-spacing:1px}
    .window[data-app="skills"] .win-h{margin-bottom:10px}

    /* ── EXPERIENCE ── */
    .exp{
      background:#5c4531;
      border:3px solid #000;border-radius:0;
      box-shadow:
        inset 3px 3px 0 #7d6350,
        inset -3px -3px 0 #3b2b1e,
        0 6px 0 rgba(0,0,0,.15);
      margin-bottom:14px;
    }
    .exp:last-child{margin-bottom:0}
    .exp-dates{
      display:block;
      font-family:var(--font-pixel);font-size:12px;font-weight:700;letter-spacing:1px;
      text-transform:uppercase;color:#ffd97e;
      text-shadow:2px 2px 0 rgba(0,0,0,.7);
      background:#3f2f20;
      padding:8px 14px;
      border-bottom:3px solid #000;
      box-shadow:inset 3px 3px 0 rgba(255,255,255,.15),inset -3px -3px 0 rgba(0,0,0,.3);
    }
    .exp h3{
      font-family:var(--font-pixel);font-size:15px;font-weight:700;letter-spacing:.5px;
      color:#f5e6d3;text-shadow:2px 2px 0 rgba(0,0,0,.7);
      margin:0;padding:12px 14px 0;line-height:1.5;
    }
    .exp-co{
      font-family:var(--font-pixel);font-size:11px;font-weight:400;letter-spacing:1px;
      color:rgba(245,230,211,.55);text-shadow:1px 1px 0 rgba(0,0,0,.6);
      padding:4px 14px 0;text-transform:uppercase;
    }
    .exp p{
      color:rgba(245,230,211,.75);font-size:13px;line-height:1.7;font-weight:500;
      text-shadow:1px 1px 0 rgba(0,0,0,.5);
      padding:8px 14px 14px;margin:0;
    }

    /* ── SERVICES ── */
    .svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
    .svc{
      position:relative;background:#5e3236;
      border:3px solid #000;border-radius:0;
      box-shadow:
        inset 3px 3px 0 #8a4a50,
        inset -3px -3px 0 #3a1c20,
        0 6px 0 rgba(0,0,0,.15);
    }
    .svc-num{
      display:block;
      font-family:var(--font-pixel);font-size:13px;font-weight:700;letter-spacing:1px;
      text-transform:uppercase;color:#ffd97e;
      text-shadow:2px 2px 0 rgba(0,0,0,.7);
      background:#462427;
      padding:8px 14px;
      border-bottom:3px solid #000;
      box-shadow:inset 3px 3px 0 rgba(255,255,255,.15),inset -3px -3px 0 rgba(0,0,0,.3);
    }
    .svc h3{
      font-family:var(--font-pixel);font-size:15px;font-weight:700;letter-spacing:.5px;
      color:#f5e6d3;text-shadow:2px 2px 0 rgba(0,0,0,.7);
      margin:0;padding:12px 14px 0;line-height:1.5;
    }
    .svc p{
      color:rgba(245,230,211,.75);font-size:12.5px;line-height:1.7;font-weight:500;
      text-shadow:1px 1px 0 rgba(0,0,0,.5);
      padding:6px 14px 14px;
    }

    /* ── CONTACT ── */
    .c-mail{
      display:block;padding:14px 16px;margin-bottom:12px;
      background:rgba(0,0,0,.25);color:#f5e6d3;text-decoration:none;
      border:1px solid rgba(245,230,211,.06);border-radius:8px;
      font-size:13.5px;letter-spacing:.5px;word-break:break-all;
      transition:border-color .3s ease,background .3s ease;
    }
    .c-mail:hover{background:rgba(245,230,211,.04);border-color:rgba(245,230,211,.2)}
    .c-mail .at{color:rgba(245,230,211,.45)}
    .c-socials{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
    .mail-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(58,21,21,.12);font-family:var(--font-body);font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:rgba(58,21,21,.5)}
    .c-form label{display:block;font-family:var(--font-body);font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:rgba(245,230,211,.4);margin:16px 0 7px}
    .c-form label span{color:#f5e6d3}
    .c-form input,.c-form textarea{
      width:100%;background:rgba(0,0,0,.22);color:#f5e6d3;border:1px solid rgba(245,230,211,.12);
      padding:10px 12px;font-family:var(--font-body);font-size:13.5px;outline:none;resize:vertical;
      transition:border-color .3s ease;
    }
    .c-form input:focus,.c-form textarea:focus{border-color:rgba(245,230,211,.4)}
    .c-form textarea{min-height:92px}
    .c-form .btn{margin-top:18px}
    .form-status{margin-top:12px;font-size:12.5px;min-height:22px}

    /* ── SYSTEM INFO (amber CRT terminal) ── */
    .term-win{
      border:1px solid rgba(255,180,94,.12);
      border-radius:6px;
      overflow:hidden;
      background:#100700;
      box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 60px rgba(120,60,0,.18);
    }
    /* full-bleed: the terminal IS the window */
    .window.term .win-body{padding:0;background:#100700;background-image:none;overflow:hidden}
    .window.term .term-win{border:0;border-radius:0;box-shadow:none;height:100%;display:flex;flex-direction:column}
    .window.term .term-screen{flex:1;overflow:auto}
    .term-screen{
      padding:14px 16px;
      font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;
      font-size:14px;line-height:1.7;
      color:#ffb45e;
      text-shadow:0 0 6px rgba(255,160,0,.35);
      min-height:300px;
      display:flex;flex-direction:column;gap:14px;align-items:center;
    }
    .term-lines{width:100%;min-width:0}
    .term-ascii{
      flex:0 0 auto;margin:0 auto;
      font-family:'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace;
      font-size:13px;line-height:1.3;letter-spacing:0;
      text-shadow:0 0 6px rgba(255,160,0,.35);
      user-select:none;-webkit-user-select:none;
    }
    .term-ascii .on{color:#fff}
    .term-ascii .off{color:rgba(255,180,94,.16)}
    .t-line{margin-bottom:3px;word-wrap:break-word;line-height:1.6;max-width:100%}
    .t-prompt{color:#fff;font-weight:700;white-space:nowrap}
    .t-cmd{color:#ffb45e}
    .t-out{color:#c47f2f;padding-left:10px;border-left:1px solid #6b4a12;margin-left:2px;word-wrap:break-word}
    .t-out .hl{color:#fff;font-weight:500}
    .t-out .info{color:#fff}
    .t-out a{color:#ffb45e;text-decoration:none;transition:color .15s}
    .t-out a:hover{color:#fff;text-decoration:underline}
    .t-sep{color:#6b4a12;margin:0 5px}
    .t-cursor{display:inline-block;width:7px;height:14px;background:#fff;vertical-align:text-bottom;margin-left:3px;animation:blink .9s step-end infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    /* ── BROWSER ── */
    .window.flat .win-body{padding:0;background-image:none;display:flex;flex-direction:column;overflow:hidden}
    .br-chrome{display:flex;flex-direction:column;height:100%;min-height:0;background:#202124}
    .br-tabs{display:flex;align-items:flex-end;gap:4px;padding:8px 8px 0;background:#202124}
    .br-tab{
      display:flex;align-items:center;gap:6px;min-width:0;height:28px;padding:0 9px;
      background:#2a2b2e;color:#e8eaed;
      clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% 100%,0 100%,0 8px,4px 8px,4px 4px,8px 4px);
    }
    .br-tab-fav svg{width:13px;height:13px;display:block}
    .br-tab-name{
      flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:var(--font-pixel);font-size:11px;letter-spacing:.5px;
    }
    .br-tab-x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .br-tab-x svg{width:10px;height:10px;display:block}
    .br-tab-x:hover{background:#3c4043}
    .br-tab-new{
      width:24px;height:24px;border:0;background:transparent;color:#e8eaed;
      font-family:var(--font-pixel);font-size:15px;line-height:1;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    .br-tab-new:hover{background:#3c4043}
    .br-bar{display:flex;align-items:center;gap:2px;padding:6px 10px 10px;background:#202124}
    .br-btn{
      width:32px;height:32px;border:0;background:transparent;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .br-btn:hover{background:#3c4043}
    .br-btn svg{width:16px;height:16px;display:block}
    .br-omni{
      flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;
      background:#3c4043;border:2px solid #3c4043;
    }
    .br-omni:focus-within{background:#202124;border-color:#8ab4f8}
    .br-omni-ico svg{width:14px;height:14px;display:block}
    .br-url{
      flex:1;min-width:0;background:transparent;border:0;color:#e8eaed;outline:none;
      font-family:var(--font-pixel);font-size:13px;
    }
    .br-go{
      flex:0 0 auto;height:30px;padding:0 14px;border:0;cursor:pointer;
      background:#1a73e8;color:#fff;font-family:var(--font-pixel);font-size:12px;letter-spacing:1px;
    }
    .br-go:hover{background:#1765cc}
    .br-extra{display:flex;align-items:center;gap:2px;padding-left:4px}
    .br-avatar{
      width:26px;height:26px;background:#8ab4f8;color:#202124;
      font-family:var(--font-pixel);font-size:12px;display:flex;align-items:center;justify-content:center;
    }
    .br-menu{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:default}
    .br-menu:hover{background:#3c4043}
    .br-menu svg{width:14px;height:14px;display:block}
    .br-frame{flex:1;min-height:0;width:100%;border:0;background:#202124;display:block}
    .br-home[hidden],.br-frame[hidden]{display:none!important}
    .br-home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:22px;padding:52px 30px 30px;overflow-y:auto;overflow-x:hidden;background:#202124}
    .br-logo{display:flex;font-family:var(--font-pixel);font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;color:#e8eaed;user-select:none}
    .br-search{
      display:flex;align-items:center;gap:10px;width:100%;max-width:500px;height:40px;padding:0 10px;
      background:#3c4043;border:2px solid #3c4043;
    }
    .br-search:focus-within{background:#202124;border-color:#8ab4f8}
    .br-search-ico svg{width:15px;height:15px;display:block}
    .br-search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:#e8eaed;font-family:var(--font-pixel);font-size:14px}
    .br-search button{
      flex:0 0 auto;width:26px;height:26px;border:0;cursor:pointer;
      background:transparent;display:flex;align-items:center;justify-content:center;
    }
    .br-search button:hover{background:#4a4d51}
    .br-search button svg{width:14px;height:14px;display:block}

    /* ── RECYCLE BIN ── */
    .bin-head{font-family:var(--font-body);font-size:16px;font-weight:600;letter-spacing:1px;color:#f5e6d3;margin-bottom:16px}
    .bin-row{
      display:flex;justify-content:space-between;gap:12px;
      padding:10px 2px;border-bottom:1px solid rgba(245,230,211,.08);
      font-size:13px;color:rgba(245,230,211,.5);
    }
    .bin-row .sz{color:rgba(245,230,211,.3);font-size:11.5px;white-space:nowrap}
    .bin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;justify-items:start}
    .bin-folder{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border:1px solid transparent;border-radius:10px}
    .bin-folder:hover{background:rgba(245,230,211,.06);border-color:rgba(245,230,211,.12)}
    .bf-ico{width:48px;height:48px}
    .bf-name{font-family:var(--font-body);font-size:12px;color:#f5e6d3;text-align:center;word-break:break-all}
    .bin-note{margin:16px 0 18px;font-size:12px;color:rgba(245,230,211,.35)}
    .bin-empty{width:100%}
    @keyframes desk-spawn{from{transform:scale(.6) translateY(18px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
    .desk-icon.spawn{animation:desk-spawn .35s ease}
    .env-pre{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:12.5px;line-height:1.9;color:#8fdfb3;background:rgba(0,0,0,.3);border:1px solid rgba(245,230,211,.1);border-radius:8px;padding:14px 16px;overflow:auto;white-space:pre-wrap}
    .ed{flex:1;display:flex;flex-direction:column;min-height:0;background:#0f1117}
    .ed-tabs{display:flex;background:#191b23;border-bottom:1px solid rgba(255,255,255,.06);padding:0 8px;flex:0 0 auto}
    .ed-tab{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:11px;color:rgba(245,230,211,.4);padding:8px 14px;border-right:1px solid rgba(255,255,255,.05);user-select:none}
    .ed-tab.active{background:#0f1117;color:#f5e6d3;box-shadow:inset 0 1px 0 #4f8cff}
    .ed-body{flex:1;overflow:auto;padding:10px 0;font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:12.5px;line-height:1.9}
    .ed-line{display:flex;white-space:pre}
    .ed-line:hover{background:rgba(255,255,255,.025)}
    .ed-num{width:42px;flex:0 0 auto;text-align:right;padding-right:14px;color:rgba(245,230,211,.22);user-select:none}
    .ed-k{color:#8ab4f8}
    .ed-eq{color:rgba(245,230,211,.35)}
    .ed-v{color:#8fdfb3}
    .ed-status{display:flex;gap:16px;padding:4px 12px;background:#191b23;border-top:1px solid rgba(255,255,255,.06);font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:10px;letter-spacing:.5px;color:rgba(245,230,211,.4);flex:0 0 auto}
    .ed-pos{margin-left:auto}
    .ce{flex:1;display:flex;min-height:0;background:#0f1117}
    .ce-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
    .ce-tabs{display:flex;background:#191b23;border-bottom:1px solid rgba(255,255,255,.06);padding:0 8px;flex:0 0 auto;overflow-x:auto;scrollbar-width:thin}
    .ce-tab{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:11px;color:rgba(245,230,211,.4);padding:8px 14px;border-right:1px solid rgba(255,255,255,.05);white-space:nowrap;flex:0 0 auto;cursor:pointer}
    .ce-tab:hover{color:#f5e6d3}
    .ce-tab.active{background:#0f1117;color:#f5e6d3;box-shadow:inset 0 1px 0 #4f8cff}
    .ce-body{flex:1;overflow:auto;padding:10px 0;font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:12px;line-height:1.8}
    .ce-line{display:flex}
    .ce-line:hover{background:rgba(255,255,255,.025)}
    .ce-num{width:44px;flex:0 0 auto;text-align:right;padding-right:14px;color:rgba(245,230,211,.22);user-select:none}
    .ce-code{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:normal;word-break:normal}
    .ce-cm{color:rgba(245,230,211,.32);font-style:italic}
    .ce-kw{color:#c792ea}
    .ce-st{color:#8fdfb3}
    .ce-status{display:flex;gap:16px;padding:4px 12px;background:#191b23;border-top:1px solid rgba(255,255,255,.06);font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace;font-size:10px;letter-spacing:.5px;color:rgba(245,230,211,.4);flex:0 0 auto}
    .ce-pos{margin-left:auto}

    /* ── LIGHT / SKIN-CREAM WINDOW (Obsidia "orbit" look) ── */
    .win-body.light{
      color:rgba(26,26,26,.66);
      background-image:
        linear-gradient(rgba(58,21,21,.02) 1px,transparent 1px),
        linear-gradient(90deg,rgba(58,21,21,.02) 1px,transparent 1px),
        radial-gradient(ellipse at 18% -10%,var(--wg1,rgba(58,21,21,.05)) 0%,transparent 55%),
        radial-gradient(ellipse at 92% 112%,var(--wg2,rgba(58,21,21,.04)) 0%,transparent 55%);
      background-size:48px 48px,48px 48px,auto,auto;
      background-repeat:repeat,repeat,no-repeat,no-repeat;
    }
    .win-body.light .name,.win-body.light .win-h{color:#3a1515}
    .win-body.light .para,.win-body.light .proj-desc,.win-body.light .svc p,
    .win-body.light .exp p,.win-body.light .bin-row{color:rgba(26,26,26,.66)}

    .win-body.light .para b{color:#3a1515}
    .win-body.light .stat,.win-body.light .proj,.win-body.light .svc,.win-body.light .c-mail{
      background:rgba(58,21,21,.05);border-color:rgba(58,21,21,.14);

    .win-body.light .exp h3,.win-body.light .bin-head,.win-body.light .s-name,

    .win-body.light .c-form label{color:rgba(58,21,21,.55)}

    .win-body.light .fm-meta{color:rgba(58,21,21,.45)}

    /* light: browser chrome */

    .win-body.light .br-tab{background:#e5cba2;color:#3a1515}

    /* ── TASKBAR — MAC-OS STYLE DOCK ── */
    #taskbar{

      width:40px;height:40px;flex:0 0 auto;

    #startBtn .start-logo svg,.task-app .tb-ico svg{width:100%;height:100%;display:block}
    .task-app::after{
      content:'';position:absolute;left:50%;bottom:2px;
      width:5px;height:5px;border-radius:50%;
      background:#fff;
      transform:translateX(-50%) scale(0);
      transition:transform .15s;
    }
    .task-app.active::after{transform:translateX(-50%) scale(1);box-shadow:0 0 8px rgba(255,255,255,.9)}

    .task-app::before,#startBtn::before{

      function fname(k) { return (APPS[k].name || k).replace(/\.(exe|txt)$/, '.js'); }
      var tabs = keys.map(function (k) {
        return '<div class="ce-tab' + (k === active ? ' active' : '') + '" data-src="' + k + '">' + fname(k) + '</div>';
      }).join('');
      var src = fakeSource(active);
      var lines = src.split('\n');
      var rows = lines.map(function (ln, i) {
        return '<div class="ce-line"><span class="ce-num">' + (i + 1) + '</span><span class="ce-code">' + highlightCode(ln) + '</span></div>';
      }).join('');
      return '<div class="ce-main">' +
        '<div class="ce-tabs">' + tabs + '</div>' +
        '<div class="ce-body">' + rows + '</div>' +
        '<div class="ce-status"><span>' + (active === 'envfile' ? 'ENV' : 'JS') + '</span><span>UTF-8</span><span>LF</span><span class="ce-pos">Ln ' + lines.length + ', Col 1</span></div>' +
        '</div>';
    }
  }
};

(function () {
  var bs = document.getElementById('bootScreen');
  if (!bs) return;
  var started = Date.now();
  var minHold = 1100;
  var videoReady = false;
  var winReady = false;
  var gone = false;
  var rcts = bs.querySelectorAll('svg rect');
  rcts.forEach(function (r, i) { r.style.animationDelay = (i * 34) + 'ms'; });
  var bsSvg = bs.querySelector('svg');
  function centerBootIcon() {
    if (!bsSvg || !window.visualViewport) return;
    var vv = window.visualViewport;
    var r = bsSvg.getBoundingClientRect();
    var shift = window.innerWidth < 768 ? 8 : 0;
    bsSvg.style.right = 'auto';
    bsSvg.style.bottom = 'auto';
    bsSvg.style.left = Math.round(vv.offsetLeft + (vv.width - r.width) / 2 + shift) + 'px';
    bsSvg.style.top = Math.round(vv.offsetTop + (vv.height - r.height) / 2) + 'px';
  }
  centerBootIcon();
  window.addEventListener('load', centerBootIcon);
  window.addEventListener('resize', centerBootIcon);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('scroll', centerBootIcon);
    window.visualViewport.addEventListener('resize', centerBootIcon);
  }
  function dismiss() {
    if (gone) return;
    gone = true;
    bs.classList.add('done');
    setTimeout(function () { if (bs.parentNode) bs.parentNode.removeChild(bs); }, 600);
  }
  function maybeDone() {
    if (gone || !videoReady || !winReady) return;
    if (Date.now() - started < minHold) return;
    dismiss();
  }
  window.addEventListener('load', function () { winReady = true; maybeDone(); });
  var wv = document.getElementById('wallpaper');
  if (wv) {
    if (wv.readyState >= 2) { videoReady = true; maybeDone(); }
    wv.addEventListener('loadeddata', function () { videoReady = true; maybeDone(); });
  } else {
    videoReady = true;
  }
  setTimeout(maybeDone, minHold);
  setTimeout(dismiss, 25000);
})();

function wireBrowser(win) {
  var box = win.querySelector('.br-chrome');
  if (!box || box._wired) return;
  box._wired = true;
  var input = box.querySelector('.br-url');
  var homeInput = box.querySelector('#brHomeInput');
  var home = box.querySelector('#brHome');
  var frame = box.querySelector('#brFrame');
  var tabName = box.querySelector('.br-tab-name');
  var history = [];
  var idx = -1;

  function hostOf(u) {
    return u.replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
  }

  function nav(url) {
    frame.src = url;
    frame.hidden = false;
    home.hidden = true;
    history = history.slice(0, idx + 1);
    history.push(url);
    idx = history.length - 1;
    input.value = url;
    if (tabName) tabName.textContent = hostOf(url) || url;
  }

  function go(val) {
    var v = (val != null ? val : input.value).trim();
    if (!v) return;
    var url;
    var m;
    if ((m = v.match(/^(?:https?:\/\/)?(?:www\.)?youtube\.com\/watch\?.*[?&]v=([\w-]{11})/i))) {
      url = 'https://www.youtube.com/embed/' + m[1];
    } else if ((m = v.match(/^(?:https?:\/\/)?youtu\.be\/([\w-]{11})/i))) {
      url = 'https://www.youtube.com/embed/' + m[1];
    } else if (/^https?:\/\//i.test(v)) {
      url = v;
    } else if (/^[\w.-]+\.[a-z]{2,}(\/\S*)?$/i.test(v)) {
      url = 'https://' + v;
    } else {
      window.open('https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(v), '_blank');
      return;
    }
    nav(url);
  }

  function goHome() {
    home.hidden = false;
    frame.hidden = true;
    input.value = '';
    input.focus();
    if (tabName) tabName.textContent = 'New Tab';
  }

  box.querySelectorAll('.br-btn, .br-go').forEach(function (b) {
    b.addEventListener('click', function () {
      var act = b.dataset.act;
      if (act === 'go') go();
      else if (act === 'back') {
        if (idx > 0) { idx--; frame.src = history[idx]; input.value = history[idx]; }
      }
    });
  });

  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  if (homeInput) homeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(homeInput.value); });
  var homeGo = box.querySelector('#brHomeGo');
  if (homeGo) homeGo.addEventListener('click', function () { go(homeInput.value); });
  var tabNew = box.querySelector('.br-tab-new');
  if (tabNew) tabNew.addEventListener('click', goHome);
  var tabX = box.querySelector('.br-tab-x');
  if (tabX) tabX.addEventListener('click', goHome);

  goHome();
}

function makeWindow(win, id) {
  var bar = win.querySelector('.win-titlebar');

  /* titlebar buttons */
  bar.querySelectorAll('.win-btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var act = btn.dataset.act;
      if (act === 'min') {
        win.classList.add('min');
        syncDock(null);
      } else if (act === 'max') {
        toggleMax(win);
      } else if (act === 'close') {
        closeWindow(win);
      }
    });
  });

  /* double-click titlebar = maximize */
  bar.addEventListener('dblclick', function (e) {
    if (!e.target.closest('.win-btn')) toggleMax(win);
  });

  /* drag */
  var drag = null;
  bar.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.win-btn')) return;
    if (win.classList.contains('max')) return;
    drag = {
      sx: e.clientX, sy: e.clientY,
      ox: win.offsetLeft, oy: win.offsetTop,
      w: win.offsetWidth
    };
    document.body.classList.add('dragging');
    bar.setPointerCapture(e.pointerId);
    focusWindow(win);
  });
  bar.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var nx = drag.ox + (e.clientX - drag.sx);
    var ny = drag.oy + (e.clientY - drag.sy);
    nx = Math.max(0, Math.min(nx, Math.max(0, window.innerWidth - 120)));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 80));
    win.style.left = nx + 'px';
    win.style.top = ny + 'px';
  });
  function endDrag(e) {
    if (!drag) return;
    drag = null;
    document.body.classList.remove('dragging');
    if (bar.hasPointerCapture && bar.hasPointerCapture(e.pointerId)) {
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);

  /* corner/edge resize */
  var rzBox = win.querySelector('.win-resize');
  if (rzBox) {
    rzBox.querySelectorAll('.rz').forEach(function (h) {
      h.addEventListener('pointerdown', function (e) {
        if (win.classList.contains('max') || win.classList.contains('min')) return;
        e.preventDefault();
        e.stopPropagation();
        focusWindow(win);
        var dir = h.dataset.rz;
        var sx = e.clientX, sy = e.clientY;
        var ow = win.offsetWidth, oh = win.offsetHeight;
        var ox = win.offsetLeft, oy = win.offsetTop;
        document.body.classList.add('dragging');
        h.setPointerCapture(e.pointerId);
        function rzMove(ev) {
          var dx = ev.clientX - sx, dy = ev.clientY - sy;
          var nw = ow, nh = oh, nx = ox, ny = oy;
          if (dir.indexOf('e') >= 0) nw = Math.max(280, ow + dx);
          if (dir.indexOf('s') >= 0) nh = Math.max(150, oh + dy);
          if (dir.indexOf('w') >= 0) { nw = Math.max(280, ow - dx); nx = ox + (ow - nw); }
          if (dir.indexOf('n') >= 0) { nh = Math.max(150, oh - dy); ny = oy + (oh - nh); }
          var vw = window.innerWidth, vh = window.innerHeight - 92;
          if (nx + nw > vw) { nw = vw - nx; if (nw < 280) { nx = vw - 280; nw = 280; } }
          if (ny + nh > vh) { nh = vh - ny; if (nh < 150) { ny = vh - 150; nh = 150; } }
          if (nx < 0) { nw += nx; nx = 0; if (nw < 280) nw = 280; }
          if (ny < 0) { nh += ny; ny = 0; if (nh < 150) nh = 150; }
          win.style.width = nw + 'px';
          win.style.height = nh + 'px';
          win.style.left = nx + 'px';
          win.style.top = ny + 'px';
        }
        function rzUp(ev) {
          document.body.classList.remove('dragging');
          if (h.hasPointerCapture && h.hasPointerCapture(e.pointerId)) {
            try { h.releasePointerCapture(e.pointerId); } catch (err) {}
          }
          h.removeEventListener('pointermove', rzMove);
          h.removeEventListener('pointerup', rzUp);
          h.removeEventListener('pointercancel', rzUp);
        }
        h.addEventListener('pointermove', rzMove);
        h.addEventListener('pointerup', rzUp);
        h.addEventListener('pointercancel', rzUp);
      });
    });
  }
}

/* ═══ PINNED DOCK APPS — every desktop app lives in the dock ═══ */
APP_ORDER.forEach(function (id) {
  var app = APPS[id];
  var b = document.createElement('button');
  b.className = 'task-app';
  b.dataset.app = id;
  b.dataset.name = app.short;
  b.style.setProperty('--ac', app.ac);
  b.innerHTML = '<span class="tb-ico">' + app.icon + '</span>';
  b.addEventListener('click', function () { openOrFocus(id); });
  document.getElementById('dockApps').appendChild(b);
});

function openOrFocus(id) {
  var wins = document.querySelectorAll('.window');
  for (var i = 0; i < wins.length; i++) {
    if (wins[i].dataset.app === id) {
      var w = wins[i];
      if (w.classList.contains('min')) {
        w.classList.remove('min');
        focusWindow(w);
      } else if (w.classList.contains('focused')) {
        w.classList.add('min');
        syncDock(null);
      } else {
        focusWindow(w);
      }
      return;
    }
  }
  openApp(id);
}

function closeWindow(win) {
  win.remove();
  var wins = Array.prototype.slice.call(document.querySelectorAll('.window:not(.min)'));
  if (wins.length) {
    wins.sort(function (a, b) { return (b.style.zIndex || 0) - (a.style.zIndex || 0); });
    focusWindow(wins[0]);
  } else {
    syncDock(null);
  }
}

function syncDock(appId) {
  var btns = document.querySelectorAll('#dockApps .task-app');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.app === appId);
  }
}

function toggleMax(win) {
  if (win.classList.contains('max')) {
    win.classList.remove('max');
    if (win._prev) {
      win.style.left = win._prev.l + 'px';
      win.style.top = win._prev.t + 'px';
      win.style.width = win._prev.w + 'px';
      win.style.height = win._prev.h + 'px';
    }
  } else {
    win._prev = { l: win.offsetLeft, t: win.offsetTop, w: win.offsetWidth, h: win.offsetHeight };
    win.classList.add('max');
  }
  focusWindow(win);
}

function focusWindow(win) {
  zTop++;
  win.style.zIndex = zTop;
  document.querySelectorAll('.window').forEach(function (w) {
    var focused = w === win && !w.classList.contains('min');
    w.classList.toggle('blur', !focused);
    w.classList.toggle('focused', focused);
  });
  syncDock(win.dataset.app);
}

/* focus on any window pointerdown */
document.addEventListener('pointerdown', function (e) {
  var win = e.target.closest('.window');
  if (win && !win.classList.contains('min')) focusWindow(win);
}, true);

/* Esc closes the top window */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var wins = Array.prototype.slice.call(document.querySelectorAll('.window:not(.min)'));
    if (wins.length) {
      wins.sort(function (a, b) { return (b.style.zIndex || 0) - (a.style.zIndex || 0); });
      var top = wins[0];
      closeWindow(top);
    }
  }
});

/* keep every window reachable after resizes — nothing can hide off-screen */
function clampWindows() {
  var vw = window.innerWidth;
  var vh = window.innerHeight - 92;
  document.querySelectorAll('.window').forEach(function (w) {
    if (w.classList.contains('max')) return;
    if (w.offsetWidth > vw) w.style.width = Math.max(280, vw) + 'px';
    if (w.offsetHeight > vh) w.style.height = vh + 'px';
    var l = parseInt(w.style.left, 10) || 0;
    var t = parseInt(w.style.top, 10) || 0;
    w.style.left = Math.min(Math.max(l, 0), Math.max(0, vw - 120)) + 'px';
    w.style.top = Math.min(Math.max(t, 0), Math.max(0, vh - 34)) + 'px';
  });
}
window.addEventListener('resize', clampWindows);

/* ════════════════════════════════════════════════
   TASKBAR / CLOCK
   ════════════════════════════════════════════════ */
var clockEl = document.getElementById('clock');
var bigTime = document.getElementById('bigTime');
var bigDate = document.getElementById('bigDate');
var mTime = document.getElementById('mTime');
var mDate = document.getElementById('mDate');
var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

function tickClock() {
  var d = new Date();
  var h = d.getHours();
  var ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  function p(n) { return (n < 10 ? '0' : '') + n; }
  if (clockEl) {
    clockEl.textContent = DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ' ' + d.getFullYear() +
      ' · ' + p(h) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' + ap;
  }
  bigTime.textContent = p(h) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  bigDate.textContent = ap + ' · ' + DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ' ' + d.getFullYear();
  if (mTime) mTime.textContent = p(h) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  if (mDate) mDate.textContent = ap + ' · ' + DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
}
tickClock();
setInterval(tickClock, 1000);

setTimeout(function () {
  toast('CLICK DOCK ICONS OR DOUBLE-CLICK DESKTOP ICONS TO OPEN PROGRAMS');
}, 800);

/* ════════════════════════════════════════════════
   START MENU
   ════════════════════════════════════════════════ */
var startMenu = document.getElementById('startMenu');
var startBtn = document.getElementById('startBtn');
var smBody = document.getElementById('smBody');

smBody.insertAdjacentHTML('beforeend', '<div class="sm-label">Pinned</div><div class="sm-grid"></div>');
var smGrid = smBody.querySelector('.sm-grid');

APP_ORDER.forEach(function (id) {
  var app = APPS[id];
  var it = document.createElement('button');
  it.className = 'sm-item';
  it.innerHTML = '<span class="ico">' + app.icon + '</span><span>' + (app.short || app.name) + '</span>';
  it.addEventListener('click', function () {

var power = document.createElement('button');
power.className = 'sm-item power';
power.innerHTML = '<span class="ico"><svg viewBox="0 0 16 16" width="30" height="30"><path d="M8 1.5v6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4.5 3.8a5.8 5.8 0 1 0 7 0" stroke="currentColor" stroke-width="2" fill="none"/></svg></span><span>SHUT DOWN</span>';
power.addEventListener('click', function () {
  startMenu.classList.remove('open');

    window.close();

startBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  var open = startMenu.classList.toggle('open');
  startBtn.classList.toggle('open', open);
});

/* ════════════════════════════════════════════════
   CONTEXT MENU + WALLPAPERS
   ════════════════════════════════════════════════ */
var ctx = document.getElementById('ctx');

function buildCtx(x, y, target) {
  ctx.innerHTML = '';
  var items = [];
  if (target) {
    _ctxApp = target.dataset.app || null;
    if (_ctxApp && APPS[_ctxApp]) {
      items.push(['OPEN WITH CODE EDITOR', function () {
        _codeData = _ctxApp;
        openApp('codeeditor');
      }]);
      items.push(['PROPERTIES', function () {
        var a = APPS[_ctxApp];
        toast(a.name.toUpperCase() + ' :: ' + a.w + 'x' + a.h + 'px :: ' + a.ac);
      }]);
    }
  }
  items.push(['REFRESH DESKTOP', function () {
    desktop.style.animation = 'none';
    void desktop.offsetWidth;
    desktop.style.animation = 'winIn .12s steps(2)';
    setTimeout(function () { desktop.style.animation = ''; }, 160);
  }],
    ['CHANGE WALLPAPER', function () { cycleWallpaper(); }],
    ['SYSTEM INFO', function () { openApp('readme'); }],
    ['ABOUT ALI', function () { openApp('about'); }]
  );
  items.forEach(function (it) {
    var b = document.createElement('button');
    b.className = 'item';
    b.textContent = it[0];
    b.addEventListener('click', function () {
      hideCtx();
      it[1]();
    });
    ctx.appendChild(b);
  });
  var w = 220;
  x = Math.min(x, window.innerWidth - w - 8);
  y = Math.min(y, window.innerHeight - ctx.offsetHeight - 96);
  ctx.style.left = Math.max(4, x) + 'px';
  ctx.style.top = Math.max(4, y) + 'px';
  ctx.style.display = 'block';
}

function hideCtx() { ctx.style.display = 'none'; }

document.addEventListener('contextmenu', function (e) {
  if (e.target.closest('.window')) return;
  e.preventDefault();
  if (window.matchMedia('(max-width:767px)').matches) return;
  hideCtx();
  startMenu.classList.remove('open');
  startBtn.classList.remove('open');
  var target = e.target.closest('.desk-icon') || e.target.closest('#dockApps .task-app');
  buildCtx(e.clientX, e.clientY, target);
});

document.addEventListener('pointerdown', function (e) {
  if (!e.target.closest('#ctx') && !e.target.closest('#startMenu') && !e.target.closest('#startBtn')) {
    hideCtx();
    startMenu.classList.remove('open');
    startBtn.classList.remove('open');
  }
  if (!e.target.closest('.desk-icon')) {
    document.querySelectorAll('.desk-icon.selected').forEach(function (i) { i.classList.remove('selected'); });
  }
});

/* ════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════ */
var toastEl = document.getElementById('toast');
var toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3400);
}

/* ════════════════════════════════════════════════
   EMAILJS CONTACT FORM
   ════════════════════════════════════════════════ */
function wireForm() {
  var btn = document.getElementById('formSendBtn');
  var status = document.getElementById('formStatus');
  if (!btn || !status || typeof emailjs === 'undefined') return;
  if (btn._wired) return;
  btn._wired = true;
  emailjs.init('X4B8AtKQidpPJi764');
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    var name = document.getElementById('formName').value.trim();
    var email = document.getElementById('formEmail').value.trim();
    var message = document.getElementById('formMessage').value.trim();
    if (!name || !email || !message) {
      status.textContent = '> ERROR: FILL IN ALL FIELDS.';
      status.style.color = '#ff6b6b';
      return;
    }
    btn.textContent = '[ SENDING... ]';
    btn.disabled = true;
    status.textContent = '';
    emailjs.send(
      'service_fn265hi',
      'template_jarexxe',
      { from_name: name, from_email: email, message: message },
      'X4B8AtKQidpPJi764'
    ).then(function () {
      status.textContent = '> MESSAGE SENT! I\'LL GET BACK TO YOU WITHIN 24 HOURS.';
      status.style.color = '#3ddc84';
      document.getElementById('formName').value = '';
      document.getElementById('formEmail').value = '';
      document.getElementById('formMessage').value = '';
    }, function () {
      status.textContent = '> FAILED TO SEND. TRY EMAILING ME DIRECTLY.';
      status.style.color = '#ff6b6b';
    }).finally(function () {
      btn.textContent = '[ SEND MESSAGE ]';
      btn.disabled = false;
    });
  });
}

if (location.search.indexOf('debug=1') !== -1) {
  var dbgEl = document.createElement('div');
  dbgEl.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:100000;background:rgba(0,0,0,.95);color:#0f0;font:bold 17px/1.5 monospace;padding:10px;pointer-events:none;white-space:pre;max-width:98vw;border:2px solid #0f0';
  document.body.appendChild(dbgEl);
  function dbgRefresh() {
    var svg = document.querySelector('#bootScreen svg');
    if (!svg) { dbgEl.textContent = 'boot gone'; return; }
    var r = svg.getBoundingClientRect();
    dbgEl.textContent =
      'inner=' + window.innerWidth + 'x' + window.innerHeight +
      ' client=' + document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight +
      ' dpr=' + window.devicePixelRatio + '\n' +
      'svg l=' + Math.round(r.left) + ' t=' + Math.round(r.top) + ' w=' + Math.round(r.width) + ' h=' + Math.round(r.height) + '\n' +
      'offX=' + Math.round(r.left + r.width / 2 - window.innerWidth / 2) +
      ' offY=' + Math.round(r.top + r.height / 2 - window.innerHeight / 2) + '\n' +
      'zoom=' + Math.round((window.innerWidth / document.documentElement.clientWidth) * 100) / 100 +
      ' vvOff=' + Math.round(window.visualViewport.offsetLeft) +
      ' vvW=' + Math.round(window.visualViewport.width);
  }
  dbgRefresh();
  setInterval(dbgRefresh, 300);
}
